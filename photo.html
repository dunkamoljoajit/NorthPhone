<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos - iOS 18</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; user-select: none; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0b0b0c; }
        .iphone { width: 393px; height: 852px; background-color: #000000; border-radius: 54px; position: relative; border: 4px solid #2d2d30; box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85); overflow: hidden; display: flex; flex-direction: column; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 10px; color: white; font-size: 15px; font-weight: 600; z-index: 30; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); }
        .status-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .photos-container { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background-color: #000000; }
        .photos-page { display: none; flex-direction: column; width: 100%; height: 100%; overflow-y: auto; padding-bottom: 20px; }
        .photos-page.active { display: flex; }
        .gallery-header { padding: 12px 18px 8px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .gallery-title { font-size: 28px; font-weight: 700; }
        .gallery-header-icons { display: flex; gap: 16px; font-size: 18px; color: #0a84ff; }
        .albums-section-title { color: #8e8e93; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 18px 8px; }
        .albums-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 18px 24px; }
        .album-card { display: flex; flex-direction: column; cursor: pointer; }
        .album-cover { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background-color: #1c1c1e; position: relative; margin-bottom: 6px; border: 0.5px solid rgba(255, 255, 255, 0.1); }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
        .album-card:active .album-cover img { transform: scale(0.96); }
        .album-name { color: #ffffff; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-count { color: #8e8e93; font-size: 13px; margin-top: 2px; }
        .album-nav-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; color: white; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); }
        .album-back-btn { color: #0a84ff; font-size: 17px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .album-nav-title { font-size: 17px; font-weight: 600; color: white; }
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px 0; }
        .photo-grid-item { aspect-ratio: 1 / 1; overflow: hidden; background: #1c1c1e; cursor: pointer; position: relative; }
        .photo-grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
        .photo-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; z-index: 40; display: none; flex-direction: column; justify-content: space-between; }
        .photo-viewer.active { display: flex; }
        .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; color: white; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 50; }
        .viewer-back { color: #0a84ff; font-size: 17px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .viewer-date-info { text-align: center; }
        .viewer-date { font-size: 14px; font-weight: 600; color: white; }
        .viewer-time { font-size: 11px; color: #8e8e93; }
        .viewer-body { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; padding: 10px 0; position: relative; touch-action: pan-y; }
        .viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.15s ease; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); font-size: 18px; color: rgba(255, 255, 255, 0.8); background: rgba(40, 40, 40, 0.5); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 55; backdrop-filter: blur(4px); }
        .nav-btn.prev-btn { left: 12px; } .nav-btn.next-btn { right: 12px; } .nav-btn.disabled { opacity: 0; pointer-events: none; }
        .viewer-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px 36px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: #0a84ff; font-size: 20px; z-index: 50; }
        .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background-color: white; border-radius: 10px; cursor: pointer; z-index: 60; display: block; }
    </style>
</head>
<body>
    <div class="iphone">
        <div class="status-bar">
            <div class="status-left" id="clock-time">16:42</div>
            <div class="status-right"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></div>
        </div>

        <div class="photos-container">
            <div id="albums-overview-page" class="photos-page active">
                <div class="gallery-header">
                    <a href="index.html#home" class="album-back-btn"><i class="fa-solid fa-chevron-left"></i> <span data-key="nav_home">Home</span></a>
                    <span class="gallery-title" data-key="title_albums">Albums</span>
                    <div class="gallery-header-icons"><i class="fa-solid fa-plus"></i></div>
                </div>
                <div class="albums-section-title" data-key="my_albums">My Albums</div>
                <div class="albums-grid" id="albums-grid-container"></div>
            </div>

            <div id="album-detail-page" class="photos-page">
                <div class="album-nav-header">
                    <span class="album-back-btn" id="back-to-albums-btn"><i class="fa-solid fa-chevron-left"></i> <span data-key="title_albums">Albums</span></span>
                    <span class="album-nav-title" id="current-album-title">Album Name</span>
                    <i class="fa-solid fa-ellipsis" style="color: #0a84ff;"></i>
                </div>
                <div class="photo-grid" id="album-photo-grid"></div>
            </div>
        </div>

        <div class="photo-viewer" id="photo-viewer">
            <div class="viewer-header">
                <span class="viewer-back" id="close-viewer-btn"><i class="fa-solid fa-chevron-left"></i> <span data-key="btn_back">Back</span></span>
                <div class="viewer-date-info"><div class="viewer-date" id="view-date">October 25, 2026</div><div class="viewer-time" id="view-time">14:20</div></div>
                <i class="fa-solid fa-arrow-up-from-bracket" style="color: #0a84ff; cursor: pointer;"></i>
            </div>
            <div class="viewer-body" id="viewer-body">
                <div class="nav-btn prev-btn" id="prev-photo-btn"><i class="fa-solid fa-chevron-left"></i></div>
                <img id="viewer-img" src="" alt="Full view">
                <div class="nav-btn next-btn" id="next-photo-btn"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="viewer-toolbar"><i class="fa-solid fa-share"></i><i class="fa-regular fa-heart" id="fav-btn"></i><i class="fa-solid fa-sliders"></i><i class="fa-regular fa-trash-can"></i></div>
        </div>

        <a href="index.html#home" class="home-indicator"></a>
    </div>

    <script>
        const uiTrans = {
            th: { nav_home: "หน้าแรก", title_albums: "อัลบั้ม", my_albums: "อัลบั้มของฉัน", fav_name: "❤️ รายการโปรด", btn_back: "กลับ", p_joe: "พี่โจของนอร์ธ", p_prewedding: "Prewedding", p_meme: "มีม101", p_4jiw: "4จิ๋ว", p_camera: "กล้อง" },
            en: { nav_home: "Home", title_albums: "Albums", my_albums: "My Albums", fav_name: "❤️ Favorites", btn_back: "Back", p_joe: "North's P'Joe", p_prewedding: "Prewedding", p_meme: "Memes 101", p_4jiw: "4 Chibi", p_camera: "Camera" },
            ja: { nav_home: "ホーム", title_albums: "アルバム", my_albums: "マイアルバム", fav_name: "❤️ お気に入り", btn_back: "戻る", p_joe: "ノースのジョー先輩", p_prewedding: "前撮り写真", p_meme: "ミーム101", p_4jiw: "4ちび", p_camera: "カメラ" },
            ko: { nav_home: "홈", title_albums: "앨범", my_albums: "나의 앨범", fav_name: "❤️ 즐겨찾기", btn_back: "뒤로", p_joe: "노스의 조 형", p_prewedding: "웨딩 스냅", p_meme: "밈 101", p_4jiw: "4꼬맹이", p_camera: "카메라" },
            zh: { nav_home: "主页", title_albums: "相册", my_albums: "我的相册", fav_name: "❤️ 个人收藏", btn_back: "返回", p_joe: "诺斯的 Johan 哥", p_prewedding: "婚纱照", p_meme: "表情包 101", p_4jiw: "4小只", p_camera: "相机" }
        };

        const rawAlbums = [
            { id: "pjoe", key: "p_joe", cover: "https://i.pinimg.com/1200x/af/97/3d/af973d950208b4c3340959f5ed7650dd.jpg", photos: [{ id: 101, url: "https://i.pinimg.com/1200x/af/97/3d/af973d950208b4c3340959f5ed7650dd.jpg", date: "Today", time: "16:10", isFav: true }, { id: 102, url: "https://i.pinimg.com/736x/73/63/ee/7363ee65c289f8872abf2332c06487dd.jpg", date: "Yesterday", time: "18:25", isFav: false }] },
            { id: "prewedding", key: "p_prewedding", cover: "https://i.pinimg.com/1200x/8d/bb/b8/8dbbb882929048c327e853120a4b5487.jpg", photos: [{ id: 201, url: "https://i.pinimg.com/1200x/8d/bb/b8/8dbbb882929048c327e853120a4b5487.jpg", date: "October 15, 2026", time: "10:00", isFav: true }] },
            { id: "meme", key: "p_meme", cover: "https://i.pinimg.com/736x/55/c9/a7/55c9a7afbf83f555170c3b96f4bdb7d9.jpg", photos: [{ id: 301, url: "https://i.pinimg.com/736x/55/c9/a7/55c9a7afbf83f555170c3b96f4bdb7d9.jpg", date: "October 20, 2026", time: "22:11", isFav: false }] },
            { id: "4jiew", key: "p_4jiw", cover: "https://i.pinimg.com/1200x/b2/74/4a/b2744a8447eb64d5e04f6c4c4d3aeefc.jpg", photos: [{ id: 401, url: "https://i.pinimg.com/1200x/4c/3e/15/4c3e150d88d2d004359544381e6ed18d.jpg", date: "October 20, 2026", time: "18:00", isFav: true }] },
            { id: "camera", key: "p_camera", cover: "https://i.pinimg.com/1200x/ac/13/d6/ac13d6cc460123ce3f165de1c540818a.jpg", photos: [{ id: 501, url: "https://i.pinimg.com/1200x/17/50/6d/17506df4e8d2427eacc962b1e07b84f0.jpg", date: "Today", time: "11:05", isFav: false }] }
        ];

        let currentPhotoList = [], currentPhotoIndex = 0;

        function renderAlbumsGrid() {
            const lang = localStorage.getItem('selectedLanguage') || 'th';
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (uiTrans[lang] && uiTrans[lang][key]) el.textContent = uiTrans[lang][key];
            });

            const container = document.getElementById('albums-grid-container');
            if (!container) return;
            container.innerHTML = '';

            let favs = [];
            rawAlbums.forEach(a => a.photos.forEach(p => { if (p.isFav) favs.push(p); }));
            const favCover = favs.length > 0 ? favs[0].url : "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&auto=format&fit=crop";

            const favCard = document.createElement('div');
            favCard.className = 'album-card';
            favCard.onclick = () => openAlbumDetail('favorites', uiTrans[lang].fav_name, favs);
            favCard.innerHTML = `<div class="album-cover"><img src="${favCover}"></div><div class="album-name">${uiTrans[lang].fav_name}</div><div class="album-count">${favs.length}</div>`;
            container.appendChild(favCard);

            rawAlbums.forEach(a => {
                const name = uiTrans[lang][a.key] || a.key;
                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbumDetail(a.id, name, a.photos);
                card.innerHTML = `<div class="album-cover"><img src="${a.cover}"></div><div class="album-name">${name}</div><div class="album-count">${a.photos.length}</div>`;
                container.appendChild(card);
            });
        }

        function openAlbumDetail(albumId, albumName, photos) {
            currentPhotoList = photos;
            document.getElementById('current-album-title').textContent = albumName;
            const gridContainer = document.getElementById('album-photo-grid');
            gridContainer.innerHTML = '';
            photos.forEach((photo, idx) => {
                const item = document.createElement('div');
                item.className = 'photo-grid-item';
                item.onclick = () => openPhotoViewer(idx);
                item.innerHTML = `<img src="${photo.url}">`;
                gridContainer.appendChild(item);
            });
            document.getElementById('albums-overview-page').classList.remove('active');
            document.getElementById('album-detail-page').classList.add('active');
        }

        document.getElementById('back-to-albums-btn').addEventListener('click', () => {
            renderAlbumsGrid();
            document.getElementById('album-detail-page').classList.remove('active');
            document.getElementById('albums-overview-page').classList.add('active');
        });

        function openPhotoViewer(index) {
            currentPhotoIndex = index;
            updateViewerContent();
            document.getElementById('photo-viewer').classList.add('active');
        }

        function updateViewerContent() {
            const photo = currentPhotoList[currentPhotoIndex];
            if (!photo) return;
            document.getElementById('viewer-img').src = photo.url;
            document.getElementById('view-date').textContent = photo.date;
            document.getElementById('view-time').textContent = photo.time;
        }

        document.getElementById('close-viewer-btn').addEventListener('click', () => {
            document.getElementById('photo-viewer').classList.remove('active');
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock(); renderAlbumsGrid();
    </script>
</body>
</html>
