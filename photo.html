    <style>
        /* --- Reset & Base Settings --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #0b0b0c;
        }

        /* --- iPhone Frame --- */
        .iphone {
            width: 393px; height: 852px; background-color: #000000;
            border-radius: 54px; position: relative;
            border: 4px solid #2d2d30; box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- Status Bar --- */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 28px 10px; color: white; font-size: 15px;
            font-weight: 600; z-index: 30; background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
        }
        .status-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }

        /* --- Photos Main Container --- */
        .photos-container {
            flex: 1; display: flex; flex-direction: column;
            position: relative; overflow: hidden; background-color: #000000;
        }

        .photos-page {
            display: none; flex-direction: column; width: 100%; height: 100%;
            overflow-y: auto; padding-bottom: 20px;
        }
        .photos-page.active { display: flex; }

        /* --- Page Header --- */
        .gallery-header {
            padding: 12px 18px 8px; display: flex; justify-content: space-between;
            align-items: center; color: white;
        }
        .gallery-title { font-size: 28px; font-weight: 700; }
        .gallery-header-icons { display: flex; gap: 16px; font-size: 18px; color: #0a84ff; }

        /* --- Albums Grid (Page 1) --- */
        .albums-section-title {
            color: #8e8e93; font-size: 13px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 12px 18px 8px;
        }
        .albums-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
            padding: 0 18px 24px;
        }
        .album-card {
            display: flex; flex-direction: column; cursor: pointer;
        }
        .album-cover {
            width: 100%; aspect-ratio: 1 / 1; border-radius: 12px;
            overflow: hidden; background-color: #1c1c1e; position: relative;
            margin-bottom: 6px; border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .album-cover img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.2s ease;
        }
        .album-card:active .album-cover img { transform: scale(0.96); }
        .album-name {
            color: #ffffff; font-size: 15px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .album-count { color: #8e8e93; font-size: 13px; margin-top: 2px; }

        /* --- Album Detail View (Page 2) --- */
        .album-nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 18px; color: white; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .album-back-btn {
            color: #0a84ff; font-size: 17px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; text-decoration: none;
        }
        .album-nav-title { font-size: 17px; font-weight: 600; color: white; }

        .photo-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
            padding: 2px 0;
        }
        .photo-grid-item {
            aspect-ratio: 1 / 1; overflow: hidden; background: #1c1c1e;
            cursor: pointer; position: relative;
        }
        .photo-grid-item img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s;
        }
        .photo-grid-item:active img { transform: scale(0.96); }

        /* --- Fullscreen Photo Viewer Modal --- */
        .photo-viewer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; z-index: 40; display: none;
            flex-direction: column; justify-content: space-between;
        }
        .photo-viewer.active { display: flex; }

        .viewer-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; color: white; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); z-index: 50;
        }
        .viewer-back {
            color: #0a84ff; font-size: 17px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .viewer-date-info { text-align: center; }
        .viewer-date { font-size: 14px; font-weight: 600; color: white; }
        .viewer-time { font-size: 11px; color: #8e8e93; }

        .viewer-body {
            flex: 1; display: flex; justify-content: center; align-items: center;
            overflow: hidden; padding: 10px 0; position: relative; touch-action: pan-y;
        }
        .viewer-body img { 
            max-width: 100%; max-height: 100%; object-fit: contain;
            transition: opacity 0.15s ease;
        }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            font-size: 18px; color: rgba(255, 255, 255, 0.8);
            background: rgba(40, 40, 40, 0.5); width: 36px; height: 36px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 55; backdrop-filter: blur(4px);
            transition: opacity 0.2s, background 0.2s;
        }
        .nav-btn:hover { color: #ffffff; background: rgba(0, 0, 0, 0.8); }
        .nav-btn.prev-btn { left: 12px; }
        .nav-btn.next-btn { right: 12px; }
        .nav-btn.disabled { opacity: 0; pointer-events: none; }

        .viewer-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 28px 36px; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); color: #0a84ff; font-size: 20px; z-index: 50;
        }
        .viewer-toolbar i { cursor: pointer; }
        .viewer-toolbar i.active { color: #ff3b30; }

        /* --- Home Indicator --- */
        .home-indicator {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%); width: 134px; height: 5px;
            background-color: white; border-radius: 10px; cursor: pointer; z-index: 60;
        }
        a.home-indicator { display: block; text-decoration: none; }
    </style>
</head>

        let currentPhotoList = [];
        let currentPhotoIndex = 0;
        let currentActivePhoto = null;

        // นาฬิกา
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock-time').textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // คำนวณรูปภาพในอัลบั้ม "รายการโปรด"
        function getFavoritePhotos() {
            let favs = [];
            albumsData.forEach(album => {
                album.photos.forEach(photo => {
                    if (photo.isFav) favs.push(photo);
                });
            });
            return favs;
        }

        // แสดงผลรายการอัลบั้มทั้งหมดพร้อมแปลภาษา
        function renderAlbumsGrid() {
            const lang = localStorage.getItem('selectedLanguage') || 'th';

            // แปลข้อความ UI หน้าเว็บตาม data-key
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (uiTrans[lang] && uiTrans[lang][key]) {
                    el.textContent = uiTrans[lang][key];
                }
            });

            const container = document.getElementById('albums-grid-container');
            if (!container) return;
            container.innerHTML = '';

            const favPhotos = getFavoritePhotos();
            const favCover = favPhotos.length > 0 ? favPhotos[0].url : "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&auto=format&fit=crop";
            const favName = uiTrans[lang].fav_name;
            
            const favCard = document.createElement('div');
            favCard.className = 'album-card';
            favCard.onclick = () => openAlbumDetail('favorites', favName, favPhotos);
            favCard.innerHTML = `
                <div class="album-cover">
                    <img src="${favCover}" alt="Favorites" referrerpolicy="no-referrer">
                </div>
                <div class="album-name">${favName}</div>
                <div class="album-count">${favPhotos.length}</div>
            `;
            container.appendChild(favCard);

            albumsData.forEach(album => {
                const transKey = albumKeys[album.id];
                const localizedName = (transKey && uiTrans[lang][transKey]) ? uiTrans[lang][transKey] : album.name;

                const card = document.createElement('div');
                card.className = 'album-card';
                card.onclick = () => openAlbumDetail(album.id, localizedName, album.photos);
                card.innerHTML = `
                    <div class="album-cover">
                        <img src="${album.cover}" alt="${localizedName}" referrerpolicy="no-referrer">
                    </div>
                    <div class="album-name">${localizedName}</div>
                    <div class="album-count">${album.photos.length}</div>
                `;
                container.appendChild(card);
            });
        }

        // เปิดเข้าดูรูปตารางภายในอัลบั้ม
        function openAlbumDetail(albumId, albumName, photos) {
            const lang = localStorage.getItem('selectedLanguage') || 'th';
            currentPhotoList = photos;
            document.getElementById('current-album-title').textContent = albumName;
            const gridContainer = document.getElementById('album-photo-grid');
            gridContainer.innerHTML = '';

            if (photos.length === 0) {
                const noPhotoText = uiTrans[lang].no_photo || "ไม่มีรูปภาพ";
                gridContainer.innerHTML = `<div style="color:#8e8e93; grid-column:1/-1; text-align:center; padding:40px 0; font-size:14px;">${noPhotoText}</div>`;
            } else {
                photos.forEach((photo, idx) => {
                    const item = document.createElement('div');
                    item.className = 'photo-grid-item';
                    item.onclick = () => openPhotoViewer(idx);
                    item.innerHTML = `<img src="${photo.url}" alt="Photo" referrerpolicy="no-referrer">`;
                    gridContainer.appendChild(item);
                });
            }

            document.getElementById('albums-overview-page').classList.remove('active');
            document.getElementById('album-detail-page').classList.add('active');
        }

        // ปุ่มย้อนกลับไปหน้ารวมอัลบั้ม
        document.getElementById('back-to-albums-btn').addEventListener('click', () => {
            renderAlbumsGrid();
            document.getElementById('album-detail-page').classList.remove('active');
            document.getElementById('albums-overview-page').classList.add('active');
        });

        // เปิดดูรูปขยายเต็มหน้าจอ (Viewer)
        function openPhotoViewer(index) {
            if (!currentPhotoList || currentPhotoList.length === 0) return;
            currentPhotoIndex = index;
            updateViewerContent();
            document.getElementById('photo-viewer').classList.add('active');
        }

        // อัปเดตข้อมูลรูปภาพ
        function updateViewerContent() {
            const photo = currentPhotoList[currentPhotoIndex];
            if (!photo) return;

            currentActivePhoto = photo;
            const imgEl = document.getElementById('viewer-img');
            imgEl.style.opacity = '0.4';
            
            setTimeout(() => {
                imgEl.src = photo.url;
                imgEl.style.opacity = '1';
            }, 80);

            document.getElementById('view-date').textContent = photo.date;
            document.getElementById('view-time').textContent = photo.time;

            const favBtn = document.getElementById('fav-btn');
            if (photo.isFav) {
                favBtn.className = 'fa-solid fa-heart active';
            } else {
                favBtn.className = 'fa-regular fa-heart';
            }

            const prevBtn = document.getElementById('prev-photo-btn');
            const nextBtn = document.getElementById('next-photo-btn');
            if (prevBtn) prevBtn.classList.toggle('disabled', currentPhotoIndex === 0);
            if (nextBtn) nextBtn.classList.toggle('disabled', currentPhotoIndex === currentPhotoList.length - 1);
        }

        function prevPhoto() {
            if (currentPhotoIndex > 0) {
                currentPhotoIndex--;
                updateViewerContent();
            }
        }

        function nextPhoto() {
            if (currentPhotoIndex < currentPhotoList.length - 1) {
                currentPhotoIndex++;
                updateViewerContent();
            }
        }

        document.getElementById('prev-photo-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            prevPhoto();
        });
        document.getElementById('next-photo-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            nextPhoto();
        });

        let touchStartX = 0;
        let touchEndX = 0;
        const viewerBody = document.getElementById('viewer-body');

        if (viewerBody) {
            viewerBody.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            viewerBody.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);
        }

        function handleSwipe() {
            const threshold = 35;
            if (touchEndX < touchStartX - threshold) {
                nextPhoto();
            } else if (touchEndX > touchStartX + threshold) {
                prevPhoto();
            }
        }

        document.getElementById('close-viewer-btn').addEventListener('click', () => {
            document.getElementById('photo-viewer').classList.remove('active');
        });

        document.getElementById('fav-btn').addEventListener('click', function() {
            if (!currentActivePhoto) return;
            currentActivePhoto.isFav = !currentActivePhoto.isFav;

            if (currentActivePhoto.isFav) {
                this.className = 'fa-solid fa-heart active';
            } else {
                this.className = 'fa-regular fa-heart';
            }
        });

        // โหลดครั้งแรก
        renderAlbumsGrid();
    </script>
