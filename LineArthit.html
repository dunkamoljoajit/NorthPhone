<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - ไอ้พี่อาทิตย์</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; user-select: none; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0b0b0c; }
        .iphone { width: 393px; height: 852px; background-color: #000000; border-radius: 54px; position: relative; border: 4px solid #2d2d30; box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85); overflow: hidden; display: flex; flex-direction: column; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 10px; color: white; font-size: 15px; font-weight: 600; background-color: #111111; z-index: 10; }
        .status-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .chat-header { background-color: #111111; padding: 10px 18px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid #222222; z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: #ffffff; font-size: 22px; text-decoration: none; cursor: pointer; }
        .chat-title { color: white; font-size: 17px; font-weight: 600; }
        .header-icons { display: flex; gap: 18px; font-size: 18px; color: #ffffff; }
        .chat-container { flex: 1; padding: 20px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: #0a0a0c; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .message-wrapper.received { align-self: flex-start; }
        .message-wrapper.sent { align-self: flex-end; align-items: flex-end; }
        .bubble { padding: 12px 16px; font-size: 15px; line-height: 1.4; border-radius: 20px; color: white; word-wrap: break-word; }
        .received .bubble { background-color: #262628; border-top-left-radius: 4px; }
        .sent .bubble { background-color: #06C755; border-top-right-radius: 4px; }
        .msg-time { font-size: 11px; color: #8e8e93; margin-top: 4px; padding: 0 4px; }
        .chat-input-area { background-color: #111111; padding: 10px 15px 25px; display: flex; align-items: center; gap: 12px; border-top: 0.5px solid #222222; }
        .input-icon { color: #8e8e93; font-size: 20px; cursor: pointer; }
        .input-box { flex: 1; background-color: #222222; color: white; border: none; border-radius: 20px; padding: 10px 15px; font-size: 15px; outline: none; }
        .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background-color: white; border-radius: 10px; z-index: 20; }
    </style>
</head>
<body>
    <div class="iphone">
        <div class="status-bar">
            <div id="clock-time">16:42</div>
            <div class="status-right">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <div class="chat-header">
            <div class="header-left">
                <a href="Line.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
                <span class="chat-title" data-key="title_arthit">ไอ้พี่อาทิตย์</span>
            </div>
            <div class="header-icons"><i class="fa-solid fa-phone"></i><i class="fa-solid fa-bars"></i></div>
        </div>

        <div class="chat-container">
            <div style="text-align: center; color: #8e8e93; font-size: 11px; margin: 5px 0;" data-key="tuesday">Tuesday</div>

            <div class="message-wrapper received"><div class="bubble" data-key="a1">ไอ้นอร์ธ คืนนี้ว่างป่าว</div><div class="msg-time">19:30</div></div>
            <div class="message-wrapper received"><div class="bubble" data-key="a2">เข้าดิสมาตี้เกมหน่อย ขาดคนนึง</div><div class="msg-time">19:31</div></div>
            <div class="message-wrapper sent"><div class="bubble" data-key="a3">เกมไรอ่ะพี่</div><div class="msg-time">19:45</div></div>
            <div class="message-wrapper received"><div class="bubble" data-key="a4">Rov รีบๆ มาล่ะ รออยู่</div><div class="msg-time">19:46</div></div>
            <div class="message-wrapper sent"><div class="bubble" data-key="a5">ผีพุ่งใต้เล่นไหมพี่</div><div class="msg-time">19:45</div></div>
            <div class="message-wrapper received"><div class="bubble" data-key="a6">เล่น ๆ มาเหอะ ไอสัส</div><div class="msg-time">19:46</div></div>

            <div style="text-align: center; color: #8e8e93; font-size: 11px; margin: 15px 0 5px;" data-key="yesterday">Yesterday</div>

            <div class="message-wrapper received"><div class="bubble" data-key="a7">นอร์ธ</div><div class="msg-time">14:00</div></div>
            <div class="message-wrapper received"><div class="bubble" data-key="a8">มึงบอกผัวมึงปลดบล็อกแชทกู</div><div class="msg-time">14:01</div></div>
            <div class="message-wrapper sent"><div class="bubble" data-key="a9">ไปทำไรให้พี่โจบล็อกอีกล่ะ</div><div class="msg-time">16:45</div></div>
        </div>

        <div class="chat-input-area">
            <i class="fa-solid fa-plus input-icon"></i><i class="fa-solid fa-camera input-icon"></i><i class="fa-regular fa-image input-icon"></i>
            <input type="text" class="input-box" placeholder="Aa">
            <i class="fa-solid fa-microphone input-icon"></i>
        </div>

        <div class="home-indicator" onclick="window.location.href='index.html#home'"></div>
    </div>

    <script>
        const translations = {
            th: { title_arthit: "ไอ้พี่อาทิตย์", tuesday: "วันอังคาร", yesterday: "เมื่อวาน", a1: "ไอ้นอร์ธ คืนนี้ว่างป่าว", a2: "เข้าดิสมาตี้เกมหน่อย ขาดคนนึง", a3: "เกมไรอ่ะพี่", a4: "Rov รีบๆ มาล่ะ รออยู่", a5: "ผีพุ่งใต้เล่นไหมพี่", a6: "เล่น ๆ มาเหอะ ไอสัส", a7: "นอร์ธ", a8: "มึงบอกผัวมึงปลดบล็อกแชทกู", a9: "ไปทำไรให้พี่โจบล็อกอีกล่ะ" },
            en: { title_arthit: "Arthit", tuesday: "Tuesday", yesterday: "Yesterday", a1: "North, free tonight?", a2: "Join Discord for gaming party, short of one player.", a3: "What game, P'?", a4: "ROV, hurry up! Waiting.", a5: "Is Daotok playing?", a6: "Yeah yeah, just get in!", a7: "North", a8: "Tell your boyfriend to unblock my chat.", a9: "What did you do to get blocked again?" },
            ja: { title_arthit: "アーティット先輩", tuesday: "火曜日", yesterday: "昨日", a1: "ノース、今夜空いてる？", a2: "ゲームのディสコード入って、1人足りない", a3: "なんのゲームですか？", a4: "ROV、早く来て！待ってる", a5: "ダオトックもやりますか？", a6: "やるやる、早く入れよ！", a7: "ノース", a8: "お前の彼氏に俺のブロック解除させろ", a9: "また何してブロックされたんですか？" },
            ko: { title_arthit: "อาทิตย์ 형", tuesday: "화요일", yesterday: "어제", a1: "노스, 오늘 밤 한가해?", a2: "디스코드 들어와라 한 명 모자란다", a3: "무슨 게임인데요?", a4: "ROV, 빨리 와 기다린다", a5: "ดาวตก 형도 해요?", a6: "한다 한다, 빨리 들어와 인마", a7: "노스", a8: "네 남친한테 내 차단 좀 풀라고 해라", a9: "또 무슨 짓을 했길래 차단당했어요?" },
            zh: { title_arthit: "อาทิตย์ 哥", tuesday: "星期二", yesterday: "昨天", a1: "诺斯，今晚有空吗？", a2: "进Discord组队打游戏，缺一个人", a3: "什么游戏啊，哥？", a4: "ROV，快点来！等着呢", a5: "ดาวตก 也玩吗？", a6: "玩玩玩，快点进来！", a7: "诺斯", a8: "叫你男人把我微信拉黑解除了", a9: "你又做啥了惹Johan哥拉黑你？" }
        };

        function applyLanguage() {
            const lang = localStorage.getItem('selectedLanguage') || 'th';
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
            });
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateClock, 1000); updateClock(); applyLanguage();
    </script>
</body>
</html>
