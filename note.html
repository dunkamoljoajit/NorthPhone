<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - iOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        /* --- Reset & Base Settings --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #0b0b0c;
        }

        /* --- iPhone Frame --- */
        .iphone {
            width: 393px; height: 852px; background-color: #000000;
            border-radius: 54px; position: relative;
            border: 4px solid #2d2d30; box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85);
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- Status Bar --- */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 28px 10px; color: white; font-size: 15px;
            font-weight: 600; z-index: 10; background-color: #000000;
        }
        .status-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }

        /* --- Notes View --- */
        .notes-container {
            flex: 1; display: flex; flex-direction: column;
            position: relative; overflow: hidden; background-color: #000000;
        }

        .notes-page {
            display: none; flex-direction: column; width: 100%; height: 100%;
            padding: 8px 18px 24px; box-sizing: border-box;
        }
        .notes-page.active { display: flex; }

        /* --- Header & Navigation --- */
        .notes-header {
            display: flex; justify-content: space-between; align-items: center;
            height: 44px; color: #e5b800; font-size: 17px;
        }
        .notes-back {
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            font-weight: 400; color: #e5b800; text-decoration: none;
        }
        .notes-title {
            font-size: 32px; font-weight: 700; margin: 8px 0 16px; color: #ffffff;
        }

        /* --- Notes List --- */
        .notes-list {
            flex: 1; background: #1c1c1e; border-radius: 12px;
            overflow-y: auto; margin-bottom: 8px;
        }
        .note-card {
            padding: 14px 16px; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
            cursor: pointer; transition: background 0.2s;
        }
        .note-card:active { background: rgba(255, 255, 255, 0.05); }
        .note-card:last-child { border-bottom: none; }
        .note-card-title {
            font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #ffffff;
        }
        .note-card-sub {
            font-size: 14px; color: #8e8e93; display: flex; gap: 8px;
        }
        .note-date { color: #8e8e93; flex-shrink: 0; }
        .note-preview {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #8e8e93;
        }

        /* --- Footer --- */
        .notes-footer {
            height: 40px; display: flex; justify-content: center;
            align-items: center; border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            color: #8e8e93; font-size: 12px; padding-bottom: 8px;
        }

        /* --- Note Detail View (Read Only) --- */
        .note-edit-date { font-size: 12px; color: #8e8e93; text-align: center; display: block; margin: 4px 0 16px; }
        .note-detail-title {
            color: #ffffff; font-size: 24px; font-weight: 700; margin-bottom: 12px;
        }
        .note-detail-body {
            flex: 1; color: #e5e5ea; font-size: 16px; line-height: 1.6;
            white-space: pre-wrap; overflow-y: auto;
        }

        /* --- Home Indicator --- */
        .home-indicator {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%); width: 134px; height: 5px;
            background-color: white; border-radius: 10px; cursor: pointer; z-index: 20;
        }
        a.home-indicator { display: block; text-decoration: none; }
    </style>
</head>
<body>
    <div class="iphone">
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left" id="clock-time">16:42</div>
            <div class="status-right">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Notes Area -->
        <div class="notes-container">
            <!-- Page 1: รายชื่อโน้ต -->
            <div id="notes-list-page" class="notes-page active">
                <div class="notes-header">
                    <a href="index.html#home" class="notes-back"><i class="fa-solid fa-chevron-left"></i> Home</a>
                </div>
                <h1 class="notes-title">Notes</h1>
                
                <div class="notes-list" id="notes-list-container">
                    <!-- รายการโน้ตจะแสดงตรงนี้ -->
                </div>

                <div class="notes-footer">
                    <span id="notes-count-text">0 Notes</span>
                </div>
            </div>

            <!-- Page 2: หน้าแสดงรายละเอียดโน้ต (อ่านอย่างเดียว) -->
            <div id="note-detail-page" class="notes-page">
                <div class="notes-header">
                    <span class="notes-back" id="back-to-list-btn"><i class="fa-solid fa-chevron-left"></i> Notes</span>
                </div>
                <span class="note-edit-date" id="detail-date"></span>
                <h2 class="note-detail-title" id="detail-title"></h2>
                <div class="note-detail-body" id="detail-body"></div>
            </div>
        </div>

        <!-- Home Bar -->
        <a href="index.html#home" class="home-indicator"></a>
    </div>

    <script>
        // รายการโน้ตสำหรับกดอ่าน
        const notesData = [
            {
                id: 1,
                title: "แพลนไปเที่ยวกับพี่โจ",
                body: "- ทริปเที่ยวทะเลช่วงวันหยุดยาว 🌊\n- พกกล้องไปด้วย (พี่โจสัญญาว่าจะถ่ายรูปสวยๆ ให้)\n- แวะคาเฟ่ร้านโปรดกินเค้กกาแฟ\n- ห้ามลืม: เคลียร์งานให้เสร็จก่อนเดินทาง!",
                date: "October 25, 2026"
            },
            {
                id: 2,
                title: "แพลนซื้อของเข้าห้อง",
                body: "1. น้ำดื่ม 2 แพ็ค\n2. นมสด + ซีเรียล\n3. ขนมปัง + เนย\n4. ขนมกินเล่นของโนอาห์และไนล่า\n5. วัตถุดิบทำสุกี้กินตอนเย็น 🍲\n6. ทิชชู่เปียก",
                date: "Yesterday"
            },
            {
                id: 3,
                title: "แพลนเที่ยวกับ 4 จิ๋ว โดยไม่มี 4",
                body: "- นัดเจอร้านชาบูหน้ามหาลัย 5 โมงเย็น 🥢\n- นัดวันทริปกาญจนบุรีเดือนหน้า\n- ถ่ายรูปอัปไอจีกลุ่ม\n- **ใครมาสายปรับนาทีละ 10 บาท!**",
                date: "October 20, 2026"
            }
        ];

        // นาฬิกา
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock-time').textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // แสดงรายการโน้ต
        function renderNotesList() {
            const container = document.getElementById('notes-list-container');
            const countText = document.getElementById('notes-count-text');
            if (!container) return;

            container.innerHTML = '';
            notesData.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.onclick = () => openNoteDetail(note.id);
                card.innerHTML = `
                    <div class="note-card-title">${note.title}</div>
                    <div class="note-card-sub">
                        <span class="note-date">${note.date}</span>
                        <span class="note-preview">${note.body}</span>
                    </div>
                `;
                container.appendChild(card);
            });

            if (countText) {
                countText.textContent = `${notesData.length} ${notesData.length === 1 ? 'Note' : 'Notes'}`;
            }
        }

        // เปิดอ่านรายละเอียดโน้ต
        function openNoteDetail(id) {
            const note = notesData.find(n => n.id === id);
            if (!note) return;

            document.getElementById('detail-date').textContent = note.date;
            document.getElementById('detail-title').textContent = note.title;
            document.getElementById('detail-body').textContent = note.body;

            document.getElementById('notes-list-page').classList.remove('active');
            document.getElementById('note-detail-page').classList.add('active');
        }

        // กดกลับไปหน้ารายการโน้ต
        document.getElementById('back-to-list-btn')?.addEventListener('click', () => {
            document.getElementById('note-detail-page').classList.remove('active');
            document.getElementById('notes-list-page').classList.add('active');
        });

        // โหลดข้อมูลครั้งแรก
        renderNotesList();
    </script>
</body>
</html>
